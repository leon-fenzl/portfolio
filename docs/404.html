<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Léon Fenzl</title>
    <script>
      // This handles the redirect for client-side routing
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <script>
      // Redirect to index.html with the current path
      sessionStorage.redirect = location.href;
      location.replace('/');
    </script>
  </body>
</html>
